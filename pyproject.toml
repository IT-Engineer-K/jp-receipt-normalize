[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jp-receipt-normalize"
version = "0.1.7"
description = "Auditable normalization and candidate extraction for Japanese document OCR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "jp-receipt-normalize contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jpdoc_normalize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["jpdoc_normalize"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[project.urls]
Homepage = "https://github.com/IT-Engineer-K/jp-receipt-normalize"
Repository = "https://github.com/IT-Engineer-K/jp-receipt-normalize"
Changelog = "https://github.com/IT-Engineer-K/jp-receipt-normalize/blob/main/CHANGELOG.md"
